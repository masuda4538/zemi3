# ═══════════════════════════════════════════════════════════════
#  このプロジェクトで使う Rust の版（メンバー全員で同じ版にそろえるため）
#
#  このフォルダーの中で cargo / npm run tauri dev を動かすと、rustup がここに書いた版を自動で使います。
#  （入っていなければ、1 回目に自動でダウンロードします）
#  版を上げるときは、ここと setup-kit の tools\config.ps1（$RustVersion）を同じ数字に変えます。
# ═══════════════════════════════════════════════════════════════
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
