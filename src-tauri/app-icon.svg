<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- アプリのアイコン（本）。これを書きかえたら npx tauri icon src-tauri/app-icon.png で icons/ を作り直す -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".75" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b2a6e" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- 背景：角の丸い四角（水色→青） -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- 表紙のふち（ページの下に見える厚み） -->
    <path d="M196 312V752c124-12 236 8 316 62 80-54 192-74 316-62V312" fill="none" stroke="#dbeafe" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 左のページ・右のページ -->
    <path d="M512 352c-74-56-182-80-292-70v438c110-10 218 14 292 70z" fill="url(#page)"/>
    <path d="M512 352c74-56 182-80 292-70v438c-110-10-218 14-292 70z" fill="url(#page)"/>
  </g>

  <!-- まん中の綴じ目 -->
  <path d="M512 356v430" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>

  <!-- ページの文字（線） -->
  <g stroke="#93c5fd" stroke-width="18" stroke-linecap="round">
    <path d="M284 402c56-4 112 6 164 30"/>
    <path d="M284 470c56-4 112 6 164 30"/>
    <path d="M284 538c56-4 112 6 164 30"/>
    <path d="M284 606c40-3 80 3 118 18"/>
    <path d="M576 432c52-24 108-34 164-30"/>
    <path d="M576 500c52-24 108-34 164-30"/>
  </g>

  <!-- しおり -->
  <path d="M664 284v178l40-32 40 32V284" fill="#facc15"/>
</svg>
