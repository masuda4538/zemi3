<!-- ═══════════════════════════════════════════════════════════════
     スタート画面（起動したときに出る、青いロード画面）★ 見た目を変えるときはここ
     ・index.html の「loading-screen」の目印のところに、そのまま入ります（vite.config.js の loadingScreen）
       → アプリのプログラムより先に出るので、HTML と CSS をここに直接書いています（JS は使わない）
     ・いつ消すか（出しておく時間・Enter キーで始める）は loading-screen.js
     ・跳ねているキャラクター（スタッピー）の画像は src/system/character/images/stabee_pose_jump.png
     ・保存しても自動では読み直されないので、アプリの画面で Ctrl + R（または起動し直す）で確かめます
     ═══════════════════════════════════════════════════════════════ -->

<!-- ロード画面の色を、前回のホワイト／ダークに合わせる（pages/settings/settings.js の applySettings が覚えておく） -->
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem("boot-theme") || "light"; } catch (e) {}
</script>

<!-- ═════ ロード画面の見た目（アプリのプログラムより先に出したいので、ここに直接書く） ═════
     背景は「青空と草原」：水色の空・お日さま・ゆっくり流れる雲・重なった緑の丘・木と花（下の <svg class="boot-land">）
     ダークモードのときは夜空（星と月）になる。まん中でスタッピーが跳ねて、アプリ名がふわっと浮かび上がる -->
<style>
  .boot {
    position: fixed; inset: 0; z-index: 100; overflow: hidden;
    display: grid; place-content: center; justify-items: center;
    background: linear-gradient(180deg, #6ec2f2 0%, #a9dcf8 45%, #dff3fd 72%, #f2fbff 100%);   /* 青空（上がこく、地平線に近いほど白っぽい） */
    color: #1d3b7a;
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", "Noto Sans CJK JP", system-ui, sans-serif;
    transition: opacity .5s ease, visibility 0s .5s;
    user-select: none;
  }
  [data-theme="dark"] .boot { background: linear-gradient(180deg, #0a1733 0%, #142a57 50%, #24427a 100%); color: #fff; }   /* 夜空 */
  .boot.is-leaving { opacity: 0; visibility: hidden; }

  /* ───── 背景：青空と草原 ───── */
  /* お日さま（右上でやわらかく光る）。夜は月になる */
  .boot-sun {
    position: absolute; right: 9%; top: 8%; width: 150px; height: 150px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fffbe6 0 34%, rgb(255 244 196 / .9) 40%, rgb(255 240 180 / 0) 70%);
    animation: boot-sun 6s ease-in-out infinite alternate;
  }
  @keyframes boot-sun { to { transform: scale(1.08); } }
  [data-theme="dark"] .boot-sun { background: radial-gradient(circle, #fdf6d8 0 26%, rgb(253 246 216 / .35) 32%, rgb(253 246 216 / 0) 62%); }

  /* 雲（左から右へ、ゆっくり流れる。速さと高さをばらばらにする） */
  .boot-cloud { position: absolute; left: -260px; width: 240px; pointer-events: none; opacity: .95; animation: boot-cloud linear infinite; }
  .boot-cloud.c1 { top: 10%; animation-duration: 70s; animation-delay: -20s; }
  .boot-cloud.c2 { top: 24%; width: 170px; animation-duration: 90s; animation-delay: -60s; opacity: .85; }
  .boot-cloud.c3 { top: 6%;  width: 200px; animation-duration: 80s; animation-delay: -45s; opacity: .9; }
  .boot-cloud.c4 { top: 34%; width: 130px; animation-duration: 110s; animation-delay: -10s; opacity: .75; }
  @keyframes boot-cloud { to { transform: translateX(calc(100vw + 300px)); } }
  [data-theme="dark"] .boot-cloud { opacity: .18; }

  /* 星（夜だけ。ちかちか光る） */
  .boot-stars { position: absolute; inset: 0 0 45% 0; display: none; pointer-events: none;
    background-image: radial-gradient(2px 2px at 12% 18%, #fff, transparent), radial-gradient(1.6px 1.6px at 28% 8%, #fff, transparent),
      radial-gradient(2px 2px at 44% 26%, #fff, transparent), radial-gradient(1.4px 1.4px at 58% 12%, #fff, transparent),
      radial-gradient(2px 2px at 70% 30%, #fff, transparent), radial-gradient(1.6px 1.6px at 84% 22%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 20% 38%, #fff, transparent), radial-gradient(1.8px 1.8px at 92% 40%, #fff, transparent);
    animation: boot-twinkle 3s ease-in-out infinite alternate; }
  [data-theme="dark"] .boot-stars { display: block; }
  @keyframes boot-twinkle { to { opacity: .45; } }

  /* 草原（丘・木・花）。画面の下に、横いっぱいに広げる */
  .boot-land { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 46vh; pointer-events: none; }
  .boot-land .far   { fill: #bfe5ad; }
  .boot-land .mid   { fill: #98d488; }
  .boot-land .near  { fill: #7cc56f; }
  .boot-land .leaf  { fill: #5fb05c; }
  .boot-land .leaf2 { fill: #7fcb78; }
  .boot-land .trunk { fill: #a07656; }
  .boot-land .grass { stroke: #5fa95a; }
  [data-theme="dark"] .boot-land .far   { fill: #24474f; }
  [data-theme="dark"] .boot-land .mid   { fill: #1f3e43; }
  [data-theme="dark"] .boot-land .near  { fill: #1a3438; }
  [data-theme="dark"] .boot-land .leaf  { fill: #1d4a3f; }
  [data-theme="dark"] .boot-land .leaf2 { fill: #24584b; }
  [data-theme="dark"] .boot-land .trunk { fill: #4b3a2e; }
  [data-theme="dark"] .boot-land .grass { stroke: #2b5a4c; }
  [data-theme="dark"] .boot-land .flower { opacity: .35; }
  /* 木がそよそよ揺れる */
  .boot-land .tree { transform-box: fill-box; transform-origin: 50% 100%; animation: boot-sway 5s ease-in-out infinite alternate; }
  @keyframes boot-sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }

  /* アプリ名（ふわっと浮かび上がる）と英語の名前 */
  .boot-title {
    position: relative; margin: 0; font-size: 34px; font-weight: 800; letter-spacing: .14em;
    text-shadow: 0 2px 0 rgb(255 255 255 / .9), 0 6px 22px rgb(255 255 255 / .9);
    animation: boot-rise .9s cubic-bezier(.2, .8, .2, 1) both;
  }
  [data-theme="dark"] .boot-title { text-shadow: 0 6px 24px rgb(0 0 0 / .45); }
  .boot-sub {
    position: relative; margin: 10px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .45em; text-indent: .45em;
    text-transform: uppercase; opacity: .75;
    animation: boot-rise .9s .15s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes boot-rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } }

  /* くるくる回る点（8 つの白い点が順番に濃くなる） */
  .boot-dots { position: relative; width: 44px; height: 44px; margin-top: 34px; animation: boot-rise .9s .3s cubic-bezier(.2, .8, .2, 1) both; }
  .boot-dots i {
    position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%;
    background: #2563eb; opacity: .2; box-shadow: 0 0 8px rgb(255 255 255 / .9);
    transform: rotate(calc(var(--n) * 45deg)) translateY(-17px);
    animation: boot-dot .8s linear infinite;
    animation-delay: calc(var(--n) * .1s - .8s);
  }
  @keyframes boot-dot { 0% { opacity: 1; } 100% { opacity: .2; } }
  [data-theme="dark"] .boot-dots i { background: #fff; }

  /* キャラクター（スタッピー）：ぴょんぴょん跳ねる。着地のときに少しつぶれて、空中では影が小さくなる */
  .boot-chara { position: relative; width: 160px; height: 200px; margin-bottom: 14px; animation: boot-rise .9s cubic-bezier(.2, .8, .2, 1) both; }
  .boot-owl {
    position: absolute; left: 50%; bottom: 12px; width: 150px; margin-left: -75px;
    transform-origin: 50% 100%; animation: boot-hop 1s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgb(15 40 110 / .25));
    -webkit-user-drag: none;
  }
  .boot-shadow {
    position: absolute; left: 50%; bottom: 4px; width: 96px; height: 14px; margin-left: -48px; border-radius: 50%;
    background: rgb(30 70 60 / .22); animation: boot-shadow 1s ease-in-out infinite;
  }
  @keyframes boot-hop {
    0%, 100% { transform: translateY(0) scale(1.07, .93); }   /* 着地：少しつぶれる */
    18%      { transform: translateY(0) scale(.96, 1.05); }   /* ふみきり：少しのびる */
    50%      { transform: translateY(-40px) scale(1, 1); }    /* いちばん上 */
    82%      { transform: translateY(0) scale(.98, 1.02); }
  }
  @keyframes boot-shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }

  /* 準備ができたら：くるくる回る点のかわりに「Enter キーを押してはじめる」（loading-screen.js が .is-ready を付ける） */
  .boot-enter {
    position: relative; display: none; align-items: center; gap: 10px; margin-top: 30px; padding: 10px 24px;
    border: 2px solid #ffffff; border-radius: 999px; background: rgb(255 255 255 / .7); color: #1d3b7a;
    box-shadow: 0 6px 18px rgb(30 60 120 / .15);
    font-size: 16px; font-weight: 800; letter-spacing: .12em;
    animation: boot-rise .6s cubic-bezier(.2, .8, .2, 1) both, boot-blink 1.6s ease-in-out .6s infinite;
  }
  .boot-enter kbd {
    padding: 2px 10px; border-radius: 7px; background: #2563eb; color: #fff;
    font: inherit; font-size: 14px; letter-spacing: .04em; box-shadow: 0 3px 0 rgb(15 40 110 / .35);
  }
  @keyframes boot-blink { 50% { opacity: .55; } }
  [data-theme="dark"] .boot-enter { background: rgb(255 255 255 / .12); color: #fff; border-color: rgb(255 255 255 / .75); box-shadow: none; }
  .boot.is-ready { cursor: pointer; }
  .boot.is-ready .boot-dots { display: none; }
  .boot.is-ready .boot-enter { display: inline-flex; }

  /* PC の「アニメーションを減らす」がオンのとき */
  @media (prefers-reduced-motion: reduce) {
    .boot-sun, .boot-cloud, .boot-stars, .boot-land .tree, .boot-title, .boot-sub, .boot-dots, .boot-chara, .boot-owl, .boot-shadow, .boot-enter { animation: none; }
    .boot-cloud { left: auto; } .boot-cloud.c1 { left: 8%; } .boot-cloud.c2 { left: 62%; } .boot-cloud.c3 { left: 36%; } .boot-cloud.c4 { left: 82%; }
  }
</style>

  <!-- キャラクター（スタッピー）と、その影 -->
