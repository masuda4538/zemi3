<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>データ詳細 - デジタル図鑑アプリ 画面モック</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/detail.css">
</head>

<body>
  <header>
    <button class="icon-btn" id="burger" aria-label="メニューを開閉"><i data-lucide="panel-left"></i><kbd>Ctrl+B</kbd></button>
    <div class="logo"><i data-lucide="book-open"></i></div>
    <h1>デジタル図鑑</h1>
    <span class="sp"></span>
    <button class="icon-btn" id="theme" aria-label="テーマ切り替え">
      <span class="i-sun"><i data-lucide="sun"></i></span>
      <span class="i-moon"><i data-lucide="moon"></i></span>
    </button>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="メインナビゲーション">
      <div class="lbl">メニュー</div>
      <a href="index.html" class="on"><i data-lucide="library"></i>ホーム／図鑑一覧<span class="n" id="n-home"></span></a>
      <a href="register.html"><i data-lucide="square-plus"></i>新規データ登録</a>
      <a href="tags.html"><i data-lucide="tags"></i>タグ一覧<span class="n" id="n-tags"></span></a>
    </nav>
    <main>
      <div class="ptitle">
        <h2 id="title">データ詳細</h2>
        <button class="gry" id="back"><i data-lucide="arrow-left"></i>戻る</button>
      </div>

      <section class="screen">
        <div class="detail-card" id="detail">
          <div class="detail-head">
            <h3 class="word-title" id="wordTitle"></h3>
            <button class="pri" id="editBtn"><i data-lucide="pencil"></i>編集</button>
          </div>

          <div class="chips" id="wordTags"></div>

          <div class="desc-section">
            <div class="sec-lbl">説明文</div>
            <div class="desc-list" id="descList"></div>
          </div>
        </div>

        <div class="empty" id="notFound">
          <p>指定された単語が見つかりません。</p>
          <p class="note">一覧画面から単語を選択し直してください。</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/detail.js"></script>
</body>

</html>
