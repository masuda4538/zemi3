<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ホーム／図鑑一覧 - デジタル図鑑アプリ 画面モック</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <header>
    <button class="icon-btn" id="burger" aria-label="メニューを開閉"><i data-lucide="panel-left"></i><kbd>Ctrl+B</kbd></button>
    <div class="logo"><i data-lucide="book-open"></i></div>
    <h1>デジタル図鑑</h1>
    <span class="sp"></span>
    <button class="icon-btn" id="theme" aria-label="テーマ切り替え">
      <span class="i-sun"><i data-lucide="sun"></i></span>
      <span class="i-moon"><i data-lucide="moon"></i></span>
    </button>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="メインナビゲーション">
      <div class="lbl">メニュー</div>
      <a href="index.html" class="on"><i data-lucide="library"></i>ホーム／図鑑一覧<span class="n" id="n-home"></span></a>
      <a href="register.html"><i data-lucide="square-plus"></i>新規データ登録</a>
      <a href="tags.html"><i data-lucide="tags"></i>タグ一覧<span class="n" id="n-tags"></span></a>
    </nav>
    <main>
      <div class="ptitle wide">
        <h2 id="title">ホーム／図鑑一覧</h2><span class="count" id="pcount"></span>
      </div>

      <section class="screen wide">
        <div class="bar search-bar">
          <div class="field">
            <input type="text" id="q" placeholder="キーワード、または #タグ（スペース区切りでAND）例: IP #ネット" aria-label="検索">
            <button class="clear" id="qclear" aria-label="入力をクリア"><i data-lucide="x"></i></button>
            <button class="filter" id="fbtn" aria-label="検索の詳細を指定"><i data-lucide="filter"></i></button>
          </div>
          <button class="pri" id="sbtn"><i data-lucide="search"></i>検索</button>
          <button class="rst" id="rbtn" disabled><i data-lucide="rotate-ccw"></i>絞り込みをリセット</button>
          <button class="grn" onclick="location.href='register.html'"><i data-lucide="plus"></i>新規登録</button>
        </div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty">
          <p>該当する単語が見つかりません。</p>
          <p class="note">キーワードや絞り込みを変えるか、新規登録で追加できます。</p>
        </div>
      </section>
    </main>
  </div>

  <!-- 検索詳細モーダル（こだわり条件） -->
  <div class="dlg-bg" id="fmodal">
    <div class="fdlg" role="dialog" aria-modal="true" aria-labelledby="ftitle">
      <div class="fdlg-head">
        <h3 id="ftitle">こだわり条件</h3>
        <button class="icon-btn" id="fclose" aria-label="閉じる"><i data-lucide="x"></i></button>
      </div>
      <div class="fdlg-body">
        <h3>■ 検索範囲</h3>
        <div class="radios">
          <label><input type="radio" name="scope" value="all" checked> すべて</label>
          <label><input type="radio" name="scope" value="word"> 単語のみ</label>
          <label><input type="radio" name="scope" value="desc"> 説明のみ</label>
          <label><input type="radio" name="scope" value="tag"> タグのみ</label>
        </div>
        <h3>■ タグで絞り込み</h3>
        <div style="position:relative">
          <input type="text" id="ftag" placeholder="タグを選択" autocomplete="off">
          <div class="suggest" id="fsug"></div>
        </div>
        <div class="chips" id="fchips"></div>
      </div>
      <div class="fdlg-foot">
        <button id="fclr">クリア</button>
        <button class="pri" id="fapply">適用</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/index.js"></script>
</body>

</html>
