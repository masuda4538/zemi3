<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホーム／図鑑一覧 - デジタル図鑑アプリ 画面モック</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <button class="icon-btn" id="burger" aria-label="メニューを開閉"><i data-lucide="panel-left"></i><kbd>Ctrl+B</kbd></button>
  <div class="logo"><i data-lucide="book-open"></i></div>
  <h1>デジタル図鑑</h1>
  <span class="sp"></span>
  <button class="icon-btn" id="theme" aria-label="テーマ切り替え"><i data-lucide="moon"></i></button>
</header>
<div class="layout">
<nav id="nav" aria-label="メインナビゲーション">
  <div class="lbl">メニュー</div>
  <a href="index.html" class="on"><i data-lucide="library"></i>ホーム／図鑑一覧<span class="n" id="n-home"></span></a>
  <a href="register.html"><i data-lucide="square-plus"></i>新規データ登録</a>
  <a href="tags.html"><i data-lucide="tags"></i>タグ一覧<span class="n" id="n-tags"></span></a>
</nav>
<main>
<div class="ptitle wide"><h2 id="title">ホーム／図鑑一覧</h2><span class="count" id="pcount"></span></div>

<section class="screen wide">
  <div class="bar search-bar">
    <div class="field">
      <input type="text" id="q" placeholder="単語を検索（例: IPアドレス）" aria-label="検索">
      <button class="filter" id="fbtn" aria-label="検索の詳細を指定"><i data-lucide="filter"></i></button>
    </div>
    <button class="pri" id="sbtn"><i data-lucide="search"></i>検索</button>
    <button class="grn" onclick="location.href='register.html'"><i data-lucide="plus"></i>新規登録</button>
    <div class="modal" id="fmodal" role="dialog" aria-label="検索の詳細">
      <h3>■ 検索範囲</h3>
      <div class="radios">
        <label><input type="radio" name="scope" value="all" checked> すべて</label>
        <label><input type="radio" name="scope" value="word"> 単語のみ</label>
        <label><input type="radio" name="scope" value="desc"> 説明のみ</label>
        <label><input type="radio" name="scope" value="tag"> タグのみ</label>
      </div>
      <h3>■ タグで絞り込み</h3>
      <div style="position:relative">
        <input type="text" id="ftag" placeholder="タグを選択" autocomplete="off">
        <div class="suggest" id="fsug"></div>
      </div>
      <div class="chips" id="fchips"></div>
      <div class="row-end"><button id="fcancel">キャンセル</button><button class="pri" id="fapply">適用</button></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"><p>該当する単語が見つかりません。</p><p class="note">キーワードや絞り込みを変えるか、新規登録で追加できます。</p></div>
</section>
</main>
</div>

<div class="dlg-bg" id="dbg">
  <div class="dlg" role="alertdialog" aria-modal="true">
    <i data-lucide="triangle-alert" class="warn" style="width:40px;height:40px"></i>
    <p id="dmsg" style="font-weight:700"></p><p id="dsub" class="note"></p>
    <div class="row-end"><button id="dno">キャンセル</button><button class="dng" id="dyes">削除する</button></div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
let flt = { scope: "all", tags: [] }, pend = [];

function renderGrid() {
  const q = $("#q").value.trim().toLowerCase();
  const r = items.filter(i => {
    const m = !q || (flt.scope === "all" ? [i.w, ...i.d, ...i.t] : flt.scope === "word" ? [i.w] : flt.scope === "desc" ? i.d : i.t)
      .some(x => x.toLowerCase().includes(q));
    return m && flt.tags.every(t => i.t.includes(t));
  });
  $("#grid").innerHTML = r.map(i => `<button class="card"><h2>${esc(i.w)}</h2><p>${esc(i.d[0])}</p><div class="chips" style="margin:0">${i.t.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></button>`).join("");
  $("#empty").style.display = r.length ? "none" : "block";
  $("#pcount").textContent = r.length + " 件";
  updateNavCounts();
}

function drawF() {
  $("#fchips").innerHTML = pend.map(t => `<span class="chip">${esc(t)}<button data-t="${esc(t)}" aria-label="外す">✕</button></span>`).join("");
  const v = $("#ftag").value.trim();
  $("#fsug").innerHTML = tags.filter(t => !pend.includes(t) && t.includes(v)).map(t => `<button data-t="${esc(t)}">${esc(t)}</button>`).join("");
}

initCommon();
$("#sbtn").onclick = renderGrid;
$("#q").addEventListener("input", renderGrid);
$("#fbtn").onclick = () => { pend = [...flt.tags]; drawF(); $("#fmodal").classList.toggle("on"); };
$("#fcancel").onclick = () => $("#fmodal").classList.remove("on");
$("#fapply").onclick = () => {
  flt.scope = document.querySelector("[name=scope]:checked").value;
  flt.tags = [...pend];
  $("#fmodal").classList.remove("on");
  renderGrid();
};
$("#ftag").onfocus = () => { drawF(); $("#fsug").classList.add("on"); };
$("#ftag").oninput = drawF;
$("#fsug").onclick = e => { const t = e.target.dataset.t; if (t) { pend.push(t); $("#ftag").value = ""; drawF(); } };
$("#fchips").onclick = e => { const t = e.target.dataset.t; if (t) { pend = pend.filter(x => x !== t); drawF(); } };
document.addEventListener("click", e => {
  if (!e.target.closest("#fsug,#ftag")) $("#fsug").classList.remove("on");
});

renderGrid();
</script>
</body>
</html>
