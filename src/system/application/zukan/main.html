<!--
  デジタル図鑑：画面（普通の HTML） ★ このファイルを書きかえていきます
  ・<html> <head> <body> <script> は書かない（アプリの画面の中に入れるため）
  ・クラス名は zukan- から始める（ほかのアプリとぶつからないように）
  ・main.js から使う要素には data-app="名前" を付ける → main.js で app.$("名前") で探せる
  ・アプリ全体の部品の見た目も使える：btn btn-primary btn-ghost（ボタン）／ panel（枠）／ input（入力欄）
  ・画像は public/images/zukan/ に置いて <img src="/images/zukan/ファイル名.png"> で出す
-->
<div class="zukan">
  <header class="zukan-head">
    <h1 class="zukan-title">デジタル図鑑アプリ</h1>
    <p class="zukan-sub">ここにデジタル図鑑を作ります（src/system/application/zukan/main.html）</p>
  </header>

  <!-- はじめの例：消して、自分の画面を作っていってください -->
  <section class="panel zukan-card">
    <h2 class="zukan-card-title">はじめの例</h2>
    <p class="zukan-text">ボタンを押すと数が増えます。はじめて押したときは、右上にお知らせが出ます。</p>
    <div class="zukan-row">
      <button type="button" class="btn btn-primary" data-app="count-button">押してみる</button>
      <span class="zukan-count"><b data-app="count">0</b> 回</span>
    </div>
  </section>
</div>
