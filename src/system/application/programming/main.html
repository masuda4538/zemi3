<!--
  プログラム学習：画面（普通の HTML） ★ このファイルを書きかえていきます
  ・<html> <head> <body> <script> は書かない（アプリの画面の中に入れるため）
  ・クラス名は programming- から始める（ほかのアプリとぶつからないように）
  ・main.js から使う要素には data-app="名前" を付ける → main.js で app.$("名前") で探せる
  ・アプリ全体の部品の見た目も使える：btn btn-primary btn-ghost（ボタン）／ panel（枠）／ input（入力欄）
  ・画像は public/images/programming/ に置いて <img src="/images/programming/ファイル名.png"> で出す
-->
<div class="programming">
  <header class="programming-head">
    <h1 class="programming-title">プログラム学習</h1>
    <p class="programming-sub">ここにプログラム学習を作ります（src/system/application/programming/main.html）</p>
  </header>

  <!-- はじめの例：消して、自分の画面を作っていってください -->
  <section class="panel programming-card">
    <h2 class="programming-card-title">はじめの例</h2>
    <p class="programming-text">ボタンを押すと数が増えます。はじめて押したときは、右上にお知らせが出ます。</p>
    <div class="programming-row">
      <button type="button" class="btn btn-primary" data-app="count-button">押してみる</button>
      <span class="programming-count"><b data-app="count">0</b> 回</span>
    </div>
  </section>
</div>
