<!DOCTYPE html>
<!--
  ホーム：画面の入口 ★ このフォルダーの中は、全部自由に書きかえてよい
  ・このファイル（index.html）と rust/main.rs だけは、名前と場所を変えない（入口）
  ・CSS・JS は下の <link> <script> でつないでいる（ファイルを増やしたら、ここに足す）
  ・中身（名前・ログイン日数・アチーブ・時間）は js/main.js が入れる。ここは「枠」だけ
  フォルダーの中（いちばん外は index.html だけ。ほかは種類ごとのフォルダーに入れる）
    index.html                     画面の入口（このファイル）
    css/style.css                 見た目
    js/main.js                    動き
    images/                       画像
    data/                         JSON などのデータ
    rust/main.rs                  Rust の窓口：JS から呼べる関数を登録する
    rust/logic.rs                 Rust の処理（rust/main.rs から呼ぶ）
    ※ アチーブは、このフォルダーの外の src/system/achieve_setting/home.js に書く
  ホームに出しているもの（上から）
    1. いちばん上の帯 … 左にアイコンと名前、まん中にログイン日数・連続日数、右はしにスタビー（キャラクター）のあいさつ
    2. アプリを開くカード … アイコン・名前・ひとこと（押すとそのアプリを開く）
    3. アチーブ（左下）…… 全体の進み具合の円、ゴールド・シルバー・ブロンズごとの数（バー）、最近手に入れたもの（「すべて見る」でアチーブのページへ）
    4. 記録（右下）…… スタビーのひとことと、今日・今週・これまでの時間。「記録を見る」で記録のページへ
                   （くわしいグラフは記録のページ src/system/pages/records。時間を計っているのは core/storage/usage.js）
  スタビーの絵は public/images/character/ にある（ここからは /images/character/〇〇.png で読める）
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ホーム</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <div class="home">
    <!-- 1. いちばん上の帯：左にアイコンと名前、まん中にログイン日数、右はしにスタビーのあいさつ -->
    <section class="panel home-hero" aria-label="ログインしている人">
      <!-- 左はし：アイコン（画像がなければ名前の 1 文字）と、ログイン ID（上）・名前（下） -->
      <div class="home-user">
        <span class="home-avatar" id="user-avatar" aria-hidden="true"></span>
        <div class="home-user-text">
          <span class="home-user-sub" id="user-sub">ログインしていません</span>   <!-- 上：ログイン ID -->
          <strong class="home-user-name" id="user-name">ゲスト</strong>           <!-- 下：名前 -->
        </div>
      </div>
      <!-- まん中：ログイン日数（ゲストのときは「ログインすると記録されます」） -->
      <div class="home-hero-login" id="login-stats">
        <span>ログイン <b id="login-total">0</b> 日</span>
        <span class="home-hero-sep" aria-hidden="true"></span>
        <span>連続 <b id="login-streak">0</b> 日</span>
      </div>
      <button type="button" class="home-link home-hero-guest" id="go-login" hidden>ログインすると記録されます ›</button>
      <!-- 右はし：スタビーのあいさつ（ふきだし ＋ 絵）。言葉は js/main.js の drawGreet -->
      <div class="home-greet">
        <p class="home-bubble home-greet-bubble">
          <strong id="greet-hello">こんにちは！</strong>
          <span id="greet-text">今日もいっしょに学ぼう！</span>
        </p>
        <img class="home-greet-chara" src="/images/character/stabee_main.png" alt="スタビー" draggable="false">
      </div>
    </section>

    <!-- 2. アプリを開くカード（中身は js/main.js の drawApps） -->
    <section class="home-apps" aria-label="アプリを開く">
      <div class="home-apps-grid" id="app-cards"></div>
    </section>

    <!-- 3・4. いちばん下の段：左にアチーブ、右に記録へのカード（横に並べる。せまいときは、たてに並ぶ） -->
    <div class="home-bottom">
    <!-- 3. アチーブ（左。上から 全体の円 → レア度ごとの数 → 最近手に入れたもの） -->
    <section class="panel home-card home-achieve">
      <div class="home-card-head">
        <h2>アチーブ</h2>
        <button type="button" class="home-link" id="open-achieve">すべて見る ›</button>
      </div>
      <!-- 3 つを、たてに並べる：全体の円 → レア度ごとの数 → 最近手に入れたもの（スクロールで全部見られる） -->
      <div class="home-achieve-body">
        <div class="home-achieve-all">
          <div class="home-ring" id="ring" role="img" aria-label="アチーブの進み具合"></div>
          <div class="home-achieve-count">
            <strong id="achieve-count">0 / 0</strong>
            <span>こ 手に入れた</span>
          </div>
        </div>
        <div class="home-achieve-col">
          <h3 class="home-small-title">レア度ごと</h3>
          <!-- ゴールド・シルバー・ブロンズごとの数（バーの色はレア度の色） -->
          <ul class="home-rarity" id="rarity-bars"></ul>
        </div>
        <div class="home-achieve-col">
          <h3 class="home-small-title">最近手に入れた</h3>
          <ul class="home-list" id="recent"></ul>
        </div>
      </div>
    </section>

    <!-- 4. 記録へのカード（右。上にスタビーのひとこと、下に今日／今週／これまでの時間と「記録を見る」。中身は js/main.js の drawRecords） -->
    <section class="panel home-card home-records">
      <div class="home-card-head">
        <h2>記録</h2>
      </div>
      <div class="home-records-body">
        <!-- 上：空と丘の上のスタビーと、ふきだし（押しても記録のページへ）。雲はゆっくり流れる -->
        <button type="button" class="home-records-chara" id="records-chara" aria-label="記録を見る">
          <svg class="home-cloud c1" viewBox="0 0 240 110" aria-hidden="true"><path d="M30 96 C6 96 4 64 30 60 C30 34 62 26 80 42 C90 14 136 10 150 38 C170 22 204 32 204 58 C230 58 238 96 206 96 Z"/></svg>
          <svg class="home-cloud c2" viewBox="0 0 240 110" aria-hidden="true"><path d="M30 96 C6 96 4 64 30 60 C30 34 62 26 80 42 C90 14 136 10 150 38 C170 22 204 32 204 58 C230 58 238 96 206 96 Z"/></svg>
          <svg class="home-cloud c3" viewBox="0 0 240 110" aria-hidden="true"><path d="M30 96 C6 96 4 64 30 60 C30 34 62 26 80 42 C90 14 136 10 150 38 C170 22 204 32 204 58 C230 58 238 96 206 96 Z"/></svg>
          <span class="home-records-owl">
            <img src="/images/character/stabee_pose_jump.png" alt="" draggable="false">
            <span class="home-records-shadow" aria-hidden="true"></span>
          </span>
          <p class="home-bubble home-records-bubble" id="records-bubble">今週もがんばろう！</p>
        </button>
        <!-- 下：今日・今週・これまでの時間（ゲストのときは隠す）と、記録のページへのボタン -->
        <ul class="home-records-nums" id="records-nums">
          <li><span>今日</span><b id="rec-today">0分</b></li>
          <li><span>今週</span><b id="rec-week">0分</b></li>
          <li><span>これまで</span><b id="rec-all">0分</b></li>
        </ul>
        <button type="button" class="home-records-btn" id="open-records">記録を見る</button>
      </div>
    </section>
    </div>
  </div>
</body>
</html>
