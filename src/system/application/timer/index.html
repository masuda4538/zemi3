<!DOCTYPE html>
<!--
  タイマー：画面の入口 ★ このフォルダーの中は、全部自由に書きかえてよい
  ・このファイル（index.html）だけは、名前と場所を変えない（入口）
  ・見た目は css/style.css、動きは js/main.js
  ・アチーブは、このフォルダーの外の src/system/achieve_setting/timer.js に書く
  ・やりきった学習時間の内訳（記録用のデータ）は、src/system/home_setting/timer.js に書く
  ・ほかのページに切りかえても、タイマーは止まらずに動き続けます（core/page-list.js の keepAlive: true）

  画面の形（デジタル図鑑と同じ）
    上   … バー（メニューの開け閉め・アイコン・「タイマー」）
    左   … メニュー（ストップウォッチ ／ カウントダウン ／ ポモドーロ）。動いているタイマーは 右に ● と時間が出る
           下に キー操作の一覧
    右   … えらんだタイマー（見出し ・ 大きな時計 ・ 設定と記録）

  3 つのタイマー
    ストップウォッチ … スタートから時間を数える。ラップ（区切り）も取れる
    カウントダウン   … 決めた時間（時・分・秒）から減らしていき、0 になったら音とお知らせ。動いている途中で のばせる
    ポモドーロ       … 勉強（25 分）→ 休憩（5 分）をくり返す。4 回ごとに長い休憩（15 分）。時間は変えられる
  アイコンは 線の絵（SVG）を このファイルに直接書いている（インターネットなしでも出るように）
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイマー</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <!-- ───────── 上のバー ───────── -->
  <header class="tm-top">
    <button type="button" class="tm-icon-btn" id="burger" aria-label="メニューを開け閉めする" aria-controls="nav" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
      <kbd>Ctrl+B</kbd>
    </button>
    <div class="tm-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.3 1.6M10 2.5h4M18.5 6l1.4-1.4"/></svg>
    </div>
    <h1>タイマー</h1>
    <span class="tm-sp"></span>
    <span class="tm-live" id="live" hidden></span>
  </header>

  <div class="tm-layout">
    <!-- ───────── 左：メニュー ───────── -->
    <nav id="nav" aria-label="タイマーの種類">
      <div class="lbl">メニュー</div>
      <div class="tm-menu" id="modes" role="tablist" aria-orientation="vertical">
        <button type="button" role="tab" data-mode="stopwatch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4M10 2.5h4M12 2.5V6"/></svg>
          <span class="t">ストップウォッチ</span><span class="n" id="n-stopwatch"></span><kbd>1</kbd>
        </button>
        <button type="button" role="tab" data-mode="countdown">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10M7 21h10"/><path d="M8 3c0 4.5 8 5 8 9s-8 4.5-8 9M16 3c0 4.5-8 5-8 9s8 4.5 8 9"/></svg>
          <span class="t">カウントダウン</span><span class="n" id="n-countdown"></span><kbd>2</kbd>
        </button>
        <button type="button" role="tab" data-mode="pomodoro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.2 5M4 12A8 8 0 0 1 18.2 7"/><path d="M18.5 3.5V7.3h-3.8M5.5 20.5v-3.8h3.8"/></svg>
          <span class="t">ポモドーロ</span><span class="n" id="n-pomodoro"></span><kbd>3</kbd>
        </button>
      </div>

      <!-- キー操作の一覧（下にくっつける） -->
      <div class="tm-keys">
        <div class="lbl">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></svg>キー操作
        </div>
        <dl>
          <div><dt><kbd>Space</kbd></dt><dd>スタート ／ 一時停止</dd></div>
          <div><dt><kbd>R</kbd></dt><dd>リセット</dd></div>
          <div><dt><kbd>L</kbd></dt><dd>ラップ</dd></div>
          <div><dt><kbd>N</kbd></dt><dd>次へ（ポモドーロ）</dd></div>
          <div><dt><kbd>1</kbd>〜<kbd>3</kbd></dt><dd>タイマーを切りかえ</dd></div>
          <div><dt><kbd>Ctrl+B</kbd></dt><dd>メニューを開け閉め</dd></div>
        </dl>
      </div>
    </nav>

    <!-- ───────── 右：えらんだタイマー ───────── -->
    <main>
      <div class="ptitle">
        <h2 id="title">ストップウォッチ</h2>
        <span class="count" id="state">止まっています</span>
      </div>

      <div class="tm-main">
        <!-- 時計（まわりの輪は、カウントダウン・ポモドーロの進み具合） -->
        <section class="tm-card tm-clock-card" aria-label="時計">
          <div class="tm-phase" id="phase">ストップウォッチ</div>
          <div class="tm-dial">
            <svg class="tm-ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="tm-ring-track" cx="60" cy="60" r="54"/>
              <circle class="tm-ring-val" id="ring" cx="60" cy="60" r="54"/>
            </svg>
            <div class="tm-time" id="time" aria-live="off">00:00</div>
            <div class="tm-sub" id="sub"></div>
          </div>
          <div class="tm-buttons">
            <button type="button" class="tm-btn pri tm-btn-main" id="start"><span id="start-label">スタート</span><kbd>Space</kbd></button>
            <button type="button" class="tm-btn" id="lap">ラップ<kbd>L</kbd></button>
            <button type="button" class="tm-btn" id="skip">次へ<kbd>N</kbd></button>
            <button type="button" class="tm-btn" id="reset">リセット<kbd>R</kbd></button>
          </div>
        </section>

        <!-- それぞれのタイマーの設定・記録（えらんでいるタイマーのものだけ出す） -->
        <section class="tm-card tm-side" aria-label="設定と記録">
          <!-- ストップウォッチ：ラップの一覧 -->
          <div class="tm-pane" data-pane="stopwatch">
            <h3>ラップ<span class="count" id="laps-count">0</span></h3>
            <ol class="tm-laps" id="laps"></ol>
            <p class="tm-empty" id="laps-empty">「ラップ」（L キー）を押すと、ここに区切りの時間が並びます。</p>
          </div>

          <!-- カウントダウン：時間を決める・のばす -->
          <div class="tm-pane" data-pane="countdown">
            <h3>よく使う時間</h3>
            <div class="tm-presets" id="presets"></div>
            <h3>時間を決める</h3>
            <div class="tm-hms" id="hms">
              <label><input class="tm-num" id="cd-h" type="number" min="0" max="9" step="1" inputmode="numeric" aria-label="時間"><span>時間</span></label>
              <label><input class="tm-num" id="cd-m" type="number" min="0" max="59" step="1" inputmode="numeric" aria-label="分"><span>分</span></label>
              <label><input class="tm-num" id="cd-s" type="number" min="0" max="59" step="1" inputmode="numeric" aria-label="秒"><span>秒</span></label>
            </div>
            <p class="tm-note" id="cd-lock">動いている間は時間を決め直せません（リセットすると変えられます）。そのかわり、下の ボタンで のばせます。</p>
            <h3>のばす</h3>
            <div class="tm-extend" id="extend">
              <button type="button" class="tm-btn" data-add="60">＋1 分</button>
              <button type="button" class="tm-btn" data-add="300">＋5 分</button>
              <button type="button" class="tm-btn" data-add="600">＋10 分</button>
            </div>
          </div>

          <!-- ポモドーロ：時間の設定と、今日の回数 -->
          <div class="tm-pane" data-pane="pomodoro">
            <h3>設定</h3>
            <div class="tm-rows">
              <label class="tm-row"><span>勉強</span><span class="tm-step"><input class="tm-num" id="pm-work" type="number" min="1" max="180"><span>分</span></span></label>
              <label class="tm-row"><span>休憩</span><span class="tm-step"><input class="tm-num" id="pm-short" type="number" min="1" max="60"><span>分</span></span></label>
              <label class="tm-row"><span>長い休憩（4 回ごと）</span><span class="tm-step"><input class="tm-num" id="pm-long" type="number" min="1" max="90"><span>分</span></span></label>
              <label class="tm-row"><span>終わったら次をすぐ始める</span><input type="checkbox" id="pm-auto" class="tm-check"></label>
            </div>
            <h3>今日の勉強</h3>
            <div class="tm-today">
              <div><b id="pm-count">0</b><span>回</span></div>
              <div><b id="pm-minutes">0</b><span>分</span></div>
            </div>
            <div class="tm-dots" id="pm-dots" aria-label="4 回のうち何回目か"></div>
          </div>

          <!-- どのタイマーでも：音 -->
          <label class="tm-row tm-sound"><span>終わったときに音を鳴らす</span><input type="checkbox" id="sound" class="tm-check"></label>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
