<!--
  情報収集：画面（普通の HTML） ★ このファイルを書きかえていきます
  ・<html> <head> <body> <script> は書かない（アプリの画面の中に入れるため）
  ・クラス名は research- から始める（ほかのアプリとぶつからないように）
  ・main.js から使う要素には data-app="名前" を付ける → main.js で app.$("名前") で探せる
  ・アプリ全体の部品の見た目も使える：btn btn-primary btn-ghost（ボタン）／ panel（枠）／ input（入力欄）
  ・画像は public/images/research/ に置いて <img src="/images/research/ファイル名.png"> で出す
-->
<div class="research">
  <header class="research-head">
    <h1 class="research-title">情報収集アプリ</h1>
    <p class="research-sub">ここに情報収集を作ります（src/system/application/research/main.html）</p>
  </header>

  <!-- はじめの例：消して、自分の画面を作っていってください -->
  <section class="panel research-card">
    <h2 class="research-card-title">はじめの例</h2>
    <p class="research-text">ボタンを押すと数が増えます。はじめて押したときは、右上にお知らせが出ます。</p>
    <div class="research-row">
      <button type="button" class="btn btn-primary" data-app="count-button">押してみる</button>
      <span class="research-count"><b data-app="count">0</b> 回</span>
    </div>
  </section>
</div>
